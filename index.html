<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const stored = localStorage.getItem('color-scheme');
        if (stored === 'light' || stored === 'dark') {
          document
            .querySelector('meta[name="color-scheme"]')
            .setAttribute('content', stored);
        }
      } catch {}

      // 첫 화면의 막이 뜨기 전에 내용이 먼저 보이지 않게 가린다.
      // 스크립트가 늦거나 실패해도 4초 뒤에는 반드시 걷힌다.
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('intro-pending');
        setTimeout(() => {
          document.documentElement.classList.remove('intro-pending');
        }, 4000);
      }
    </script>
    <style>
      html.intro-pending body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 60;
        background: light-dark(#191713, #f0ebe1);
      }
    </style>
    <title>원우연 — 프론트엔드 개발자</title>
    <meta
      name="description"
      content="프론트엔드 개발자 원우연의 포트폴리오. 조지아 한인 중고거래 앱 피치마켓, 브라우저 게임 별마실, 하고-만달을 설계하고 운영합니다."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
  </head>
  <body class="overflow-x-clip">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
